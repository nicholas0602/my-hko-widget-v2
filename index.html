<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Weather Warning Card Minimal</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --muted: #444;
      --line: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 280px;
      min-height: 140px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      letter-spacing: 0.1px;
    }

    body {
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
    }

    .title {
      font-size: 15px;
      line-height: 1.02;
      font-weight: 700;
      border-bottom: 2px solid var(--line);
      padding-bottom: 6px;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    .warning-line {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      word-break: break-word;
      white-space: normal;
    }

    .meta {
      font-size: 11px;
      line-height: 1.2;
      color: var(--muted);
      border-top: 1px solid #bbb;
      padding-top: 5px;
    }

    .error {
      font-size: 12px;
      line-height: 1.2;
    }

    .noalert {
      font-size: 15px;
      line-height: 1.18;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="title">天氣警告一覽</div>
    <div id="content" class="main"><div>讀取中…</div></div>
    <div id="meta" class="meta"></div>
  </main>

  <script>
    const API_URL = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';
    const contentEl = document.getElementById('content');
    const metaEl = document.getElementById('meta');

    const clean = s => (s || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '';
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function humanizeWarning(item) {
      const name = clean(item?.name || '');
      const type = clean(item?.type || '');
      const code = clean(item?.code || '');

      if (name.includes('暴雨警告信號') && type) {
        return `${type}暴雨警告訊號`;
      }

      if (name.includes('熱帶氣旋警告信號') && type) {
        return type;
      }

      if (name.includes('雷暴警告')) {
        return '雷暴警告';
      }

      if (name) return name;
      if (type) return type;
      return code || '';
    }

    function getLatestUpdateTime(items) {
      const times = items
        .map(item => item?.updateTime || item?.issueTime)
        .filter(Boolean)
        .map(t => new Date(t))
        .filter(d => !isNaN(d.getTime()))
        .sort((a, b) => b - a);

      if (!times.length) return '';
      const hh = String(times[0].getHours()).padStart(2, '0');
      const mm = String(times[0].getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function renderNoWarning() {
      contentEl.innerHTML = `<div class="noalert">現時無天氣警告</div>`;
      metaEl.textContent = '';
    }

    function renderWarnings(items) {
      const lines = items
        .map(item => {
          const text = humanizeWarning(item);
          const issueTime = formatTime(item?.issueTime);
          if (!text) return '';
          if (issueTime) return `<div class="warning-line">${text}（${issueTime}起）</div>`;
          return `<div class="warning-line">${text}</div>`;
        })
        .filter(Boolean)
        .join('');

      contentEl.innerHTML = lines || `<div class="noalert">現時無天氣警告</div>`;

      const latest = getLatestUpdateTime(items);
      metaEl.textContent = latest ? `最後更新 ${latest}` : '';
    }

    async function loadWarning() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        const items = Object.values(data || {}).filter(Boolean);

        if (!items.length) {
          renderNoWarning();
          return;
        }

        renderWarnings(items);
      } catch (err) {
        contentEl.innerHTML = `<div class="error">未能讀取天文台資料。<br>${err.message}</div>`;
        metaEl.textContent = '';
      }
    }

    loadWarning();
    setInterval(loadWarning, 60000);
  </script>
</body>
</html>
