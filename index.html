<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Weather Warning Card Minimal</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --muted: #333;
      --line: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 280px;
      min-height: 140px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      letter-spacing: 0.1px;
    }

    body {
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }

    .title {
      font-size: 15px;
      line-height: 1.02;
      font-weight: 700;
      border-bottom: 2px solid var(--line);
      padding-bottom: 6px;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    .main {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
    }

    .headline {
      font-size: 15px;
      line-height: 1.18;
      font-weight: 700;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 6;
      overflow: hidden;
      word-break: break-word;
      white-space: normal;
    }

    .warning-line {
      font-size: 15px;
      line-height: 1.18;
      font-weight: 700;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      word-break: break-word;
      white-space: normal;
    }

    .error {
      font-size: 12px;
      line-height: 1.2;
    }

    .noalert {
      font-size: 15px;
      line-height: 1.18;
      font-weight: 700;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="title">天氣警告一覽</div>
    <div id="content" class="main"><div>讀取中…</div></div>
  </main>

  <script>
    const API_URL = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';
    const contentEl = document.getElementById('content');

    const clean = s => (s || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    function buildWarningText(item) {
      const name = clean(item?.name || '');
      const type = clean(item?.type || '');
      const code = clean(item?.code || '');

      if (name && type) return `${name}：${type}`;
      if (name && code) return `${name}：${code}`;
      return name || type || code || '';
    }

    function renderNoWarning() {
      contentEl.innerHTML = `
        <div class="noalert">現時無天氣警告</div>
      `;
    }

    function renderWarnings(list) {
      contentEl.innerHTML = list
        .map(text => `<div class="warning-line">${text}</div>`)
        .join('');
    }

    async function loadWarning() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();

        const warnings = Object.values(data || {})
          .map(buildWarningText)
          .filter(Boolean);

        if (warnings.length === 0) {
          renderNoWarning();
          return;
        }

        renderWarnings(warnings);
      } catch (err) {
        contentEl.innerHTML = `<div class="error">未能讀取天文台資料。<br>${err.message}</div>`;
      }
    }

    loadWarning();
    setInterval(loadWarning, 60000);
  </script>
</body>
</html>
