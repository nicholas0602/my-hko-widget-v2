<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Weather Warning Card 280x140</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #000;
      --muted: #444;
      --line: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 280px;
      height: 140px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      letter-spacing: 0.1px;
    }

    body {
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .wrap {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 6px;
    }

    .title {
      font-size: 15px;
      line-height: 1.02;
      font-weight: 700;
      border-bottom: 2px solid var(--line);
      padding-bottom: 6px;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .warning-line {
      font-size: 15px;
      line-height: 1.14;
      font-weight: 700;
      word-break: break-word;
      white-space: normal;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
      overflow: hidden;
    }

    .more-line {
      font-size: 13px;
      line-height: 1.12;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .noalert {
      font-size: 15px;
      line-height: 1.18;
      font-weight: 700;
    }

    .error {
      font-size: 12px;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="title">天氣警告一覽</div>
    <div id="content" class="main"><div>讀取中…</div></div>
  </main>

  <script>
    const API_URL = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc';
    const contentEl = document.getElementById('content');
    const MAX_VISIBLE = 3;

    const clean = s => (s || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return '';
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }

    function humanizeWarning(item) {
      const name = clean(item?.name || '');
      const type = clean(item?.type || '');
      const code = clean(item?.code || '');

      if (name.includes('暴雨警告信號') && type) {
        return `${type}暴雨警告訊號`;
      }

      if (name.includes('熱帶氣旋警告信號') && type) {
        return type;
      }

      if (name.includes('雷暴警告')) {
        return '雷暴警告';
      }

      if (name) return name;
      if (type) return type;
      return code || '';
    }

    function buildLine(item) {
      const text = humanizeWarning(item);
      const issueTime = formatTime(item?.issueTime);

      if (!text) return '';
      if (issueTime) return `${text}（${issueTime}起）`;
      return text;
    }

    function renderNoWarning() {
      contentEl.innerHTML = `<div class="noalert">現時無天氣警告</div>`;
    }

    function renderWarnings(items) {
      const lines = items
        .map(buildLine)
        .filter(Boolean);

      if (!lines.length) {
        renderNoWarning();
        return;
      }

      const visible = lines.slice(0, MAX_VISIBLE);
      const remaining = lines.length - MAX_VISIBLE;

      let html = visible
        .map(text => `<div class="warning-line">${text}</div>`)
        .join('');

      if (remaining > 0) {
        html += `<div class="more-line">另有 ${remaining} 項警告</div>`;
      }

      contentEl.innerHTML = html;
    }

    async function loadWarning() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const data = await res.json();
        const items = Object.values(data || {}).filter(Boolean);

        if (!items.length) {
          renderNoWarning();
          return;
        }

        renderWarnings(items);
      } catch (err) {
        contentEl.innerHTML = `<div class="error">未能讀取天文台資料。<br>${err.message}</div>`;
      }
    }

    loadWarning();
    setInterval(loadWarning, 60000);
  </script>
</body>
</html>
